name: CI (development)

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: ci-development-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DotSettings.slnx

      - name: Build
        run: dotnet build DotSettings.slnx -c Release --no-restore

      - name: Test
        run: dotnet test DotSettings.slnx -c Release --no-build --verbosity normal
