name: Publish NuGet

on:
  workflow_dispatch:
    inputs:
      packages:
        description: Which packages to publish
        required: true
        type: choice
        default: all
        options:
          - all
          - DotSettings
          - DotSettings.DependencyInjection

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: nuget-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing version $version"

      - name: Restore
        run: dotnet restore DotSettings.slnx

      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p artifacts
          case "${{ inputs.packages }}" in
            all)
              dotnet pack src/DotSettings/DotSettings.csproj -c Release -o artifacts --no-restore
              dotnet pack src/DotSettings.DependencyInjection/DotSettings.DependencyInjection.csproj -c Release -o artifacts --no-restore
              ;;
            DotSettings)
              dotnet pack src/DotSettings/DotSettings.csproj -c Release -o artifacts --no-restore
              ;;
            DotSettings.DependencyInjection)
              dotnet pack src/DotSettings.DependencyInjection/DotSettings.DependencyInjection.csproj -c Release -o artifacts --no-restore
              ;;
          esac

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(artifacts/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No nupkg files found in artifacts/."
            exit 1
          fi
          for pkg in "${packages[@]}"; do
            case "$pkg" in
              *.symbols.nupkg) continue ;;
            esac
            echo "Pushing $pkg"
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
